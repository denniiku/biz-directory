<html lang="en">
<head>

  <style>html,body{background:linear-gradient(to right,#f0acf7,#acf7f0,#f7f0ac);margin:0;padding:0;}body.sc-nav-open{padding-left:220px;}@media(max-width:768px){body.sc-nav-open,body.sc-nav-folded{padding-left:44px!important;}}main{opacity:0;}</style>
  <script>
    (function() {
      var p = location.pathname.replace(/\\/g, '/');
      var base = '/common_assets/';
      if (location.protocol === 'file:') {
        var i = p.toLowerCase().indexOf('/sc_web/');
        base = i !== -1 ? 'file://' + p.substring(0, i + 8) + 'common_assets/' : './common_assets/';
      }
      document.write('<link rel="stylesheet" href="' + base + 'common_new.css?v=' + Date.now() + '">');
      var s = document.createElement('script'); s.src = base + 'nav_new.js?v=' + Date.now(); s.defer = true; document.head.appendChild(s);
    })();

  <script src="./directory_data.js"></script>
  <style>
    .bd-main { padding: 48px 5vw 80px; max-width: 1360px; }
    .bd-eyebrow { font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem; color: #526D82; letter-spacing: 0.04em; margin-bottom: 6px; text-transform: none; }
    .bd-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 3.5vw, 2.85rem); color: #27374D; margin-bottom: 22px; letter-spacing: -0.02em; }

    /* Rounded Square + Checkmark Icon Styling */
    .bd-chk-svg { width: 16px; height: 16px; vertical-align: -3px; flex-shrink: 0; transition: transform 0.15s ease; }
    .bd-chk-cell { display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .bd-chk-cell:hover .bd-chk-svg { transform: scale(1.15); }

    /* 1-Row Filter Bar */
    .bd-filter-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(157, 178, 191, 0.5);
      padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
    }
    .bd-select, .bd-search {
      height: 38px; padding: 0 12px; border-radius: 8px;
      border: 1px solid rgba(157, 178, 191, 0.65);
      background: rgba(255, 255, 255, 0.9);
      color: #27374D; font-family: 'Inter', sans-serif; font-size: 0.82rem;
      outline: none; transition: border-color 0.2s ease, background 0.2s ease;
    }
    .bd-select:focus, .bd-search:focus { border-color: #27374D; background: #fff; }
    .bd-select { min-width: 150px; cursor: pointer; }
    .bd-search-wrap { flex: 1; position: relative; min-width: 160px; }
    .bd-search { width: 100%; padding-left: 32px; box-sizing: border-box; }
    .bd-search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; stroke: #526D82; fill: none; stroke-width: 2; pointer-events: none;
    }
    .bd-star-bar-btn {
      height: 38px; padding: 0 14px; border-radius: 8px;
      border: 1px solid rgba(157, 178, 191, 0.7);
      background: rgba(255, 255, 255, 0.92);
      color: #27374D; font-family: 'Space Grotesk', sans-serif; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .bd-star-bar-btn:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(39,55,77,0.08); }

    .bd-meta-row {
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.78rem; color: #526D82;
      margin-bottom: 10px; padding: 0 4px;
    }

    /* Directory List Table */
    .bd-list-box {
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(157, 178, 191, 0.5);
      border-radius: 12px; overflow: hidden;
    }
    .bd-row {
      display: grid;
      grid-template-columns: 38px 95px 165px 220px 1fr;
      align-items: center; gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid rgba(157, 178, 191, 0.28);
      font-size: 0.82rem; color: #27374D;
      transition: background 0.15s ease;

    .bd-row-head {

      border: 1px solid rgba(157, 178, 191, 0.65);

    .bd-modal-star-btn {

    /* Modal Footer: '<' on Bottom-Left, 'inquiry for ☑s' + '>' on Bottom-Right */

    .bd-direct-inq-btn {
      display: inline-flex; align-items: center; gap: 5px;
      height: 36px; padding: 0 14px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(157, 178, 191, 0.7);
      color: #27374D;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .bd-direct-inq-btn:hover {
      background: #fff; transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(39, 55, 77, 0.08);
    }

    /* Inquiry Compose Modal ([postman] : biz-directory) */
    .bd-inq-modal {
      width: 100%; max-width: 520px; background: rgba(255,255,255,0.97);
      border: 1px solid rgba(157,178,191,0.7); border-radius: 16px;

    }
    .bd-inq-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
    .bd-inq-field label { display: flex; align-items: center; gap: 5px; font-family: 'Space Grotesk', sans-serif; font-size: 0.75rem; font-weight: 700; color: #526D82; margin-bottom: 4px; }
    .bd-inq-input, .bd-inq-textarea {
      width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 8px;
      border: 1px solid rgba(157,178,191,0.7); font-family: 'Inter', sans-serif; font-size: 0.84rem; color: #27374D;
    }
    .bd-inq-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 90px; overflow-y: auto; padding: 6px; background: rgba(221,230,237,0.35); border-radius: 8px; }
    .bd-inq-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px;
      background: #fff; border: 1px solid rgba(157,178,191,0.65); font-size: 0.75rem; font-weight: 600; color: #27374D;
    }
    .bd-inq-chip button { border: none; background: none; cursor: pointer; color: #526D82; font-size: 0.9rem; padding: 0 0 0 2px; }
    .bd-inq-send {
      background: #27374D; color: #fff; border: none; border-radius: 8px; padding: 10px 16px;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.84rem; font-weight: 700; cursor: pointer;
    }

    @media (max-width: 768px) {
      .bd-filter-bar { flex-wrap: wrap; }
      .bd-select { flex: 1 1 calc(50% - 6px); min-width: 120px; }
      .bd-search-wrap { flex: 1 1 100%; }
      .bd-star-bar-btn { flex: 1 1 100%; justify-content: center; }
      .bd-row { grid-template-columns: 32px 70px 100px 1fr; gap: 8px; padding: 10px 10px; }
      .bd-col-pcat { display: none; }
    }
  </style>
</head>

  <script>
    (function() {
      // Connected to [postman] : biz-directory Google Apps Script Web App
      const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxD-PwPgkkC4289ddIBBQisgPNZNBrRSjVfJqylMrTQRlF97ERlTUMHh-eSba-yGC4C/exec";

      const ICON_UNCHECKED = '<svg class="bd-chk-svg" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="15" height="15" rx="4" stroke="#9DB2BF" stroke-width="1.8" fill="rgba(255,255,255,0.85)"/></svg>';
      const ICON_CHECKED   = '<svg class="bd-chk-svg" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="16" height="16" rx="4.5" fill="#27374D"/><path d="M6 10.3L8.8 13.1L14.2 7.3" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const allData = Array.isArray(window.SC_DIRECTORY_DATA) ? window.SC_DIRECTORY_DATA : [];
      let filtered = [];
      let currentModalIdx = -1;
      const starredIds = new Set(JSON.parse(localStorage.getItem('sc_starred_companies') || '[]'));

      const elCountry = document.getElementById('bd-country');
      const elIndustry = document.getElementById('bd-industry');
      const elPcat = document.getElementById('bd-pcat');
      const elSearch = document.getElementById('bd-search');
      const elListBody = document.getElementById('bd-list-body');
      const elCount = document.getElementById('bd-count');
      const elStarCount = document.getElementById('bd-star-count');

      function saveStars() {
        localStorage.setItem('sc_starred_companies', JSON.stringify(Array.from(starredIds)));
        elStarCount.textContent = '(' + starredIds.size + ')';
      }
      saveStars();

      const preferredIndOrder = ['ai','robot','it & electronics','beauty','food','pet','pet clinic','medical & healthcare','living & lifestyle','outdoor & leisure','industrial & material'];
      const indSet = new Set();
      allData.forEach(d => { if (d.industry) indSet.add(d.industry.toLowerCase()); });
      preferredIndOrder.forEach(i => indSet.add(i));
      const sortedInds = Array.from(indSet).sort((a,b) => {
        const ia = preferredIndOrder.indexOf(a), ib = preferredIndOrder.indexOf(b);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return a.localeCompare(b);
      });
      elIndustry.innerHTML = '<option value="">industry: all</option>' +
        sortedInds.map(ind => '<option value="' + ind + '">' + ind + '</option>').join('');

      function updateProductCategories() {
        const selInd = elIndustry.value.toLowerCase();
        const currentPcat = elPcat.value.toLowerCase();
        const pcatSet = new Set();
        allData.forEach(item => {
          if (!selInd || (item.industry || '').toLowerCase() === selInd) {
            if (item.product_category) pcatSet.add(item.product_category.toLowerCase());
          }
        });
        const sorted = Array.from(pcatSet).sort();
        elPcat.innerHTML = '<option value="">product category: all</option>' +
          sorted.map(c => '<option value="' + c + '">' + c + '</option>').join('');
        if (sorted.includes(currentPcat)) elPcat.value = currentPcat;
      }

      function getCategoryFallbackPhoto(item) {
        const t = ((item.industry || '') + ' ' + (item.product_category || '')).toLowerCase();
        if (t.includes('ginseng') || t.includes('herbal')) return 'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=700&q=80';
        if (t.includes('seafood') || t.includes('marine')) return 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=700&q=80';
        if (t.includes('tea') || t.includes('beverage') || t.includes('kombucha')) return 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=700&q=80';
        if (t.includes('food')) return 'https://images.unsplash.com/photo-1580651315530-69c8e0026377?auto=format&fit=crop&w=700&q=80';
        if (t.includes('beauty') || t.includes('skincare') || t.includes('cosmetic') || t.includes('hair')) return 'https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=700&q=80';
        if (t.includes('baby') || t.includes('kids')) return 'https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?auto=format&fit=crop&w=700&q=80';
        if (t.includes('living') || t.includes('bedding') || t.includes('chair') || t.includes('kitchen')) return 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?auto=format&fit=crop&w=700&q=80';
        if (t.includes('outdoor') || t.includes('camp') || t.includes('golf')) return 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=700&q=80';
        if (t.includes('pet')) return 'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=700&q=80';
        if (t.includes('robot')) return 'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=700&q=80';
        if (t.includes('medical') || t.includes('health')) return 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=700&q=80';
        if (t.includes('ai')) return 'https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=700&q=80';
        return 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=700&q=80';
      }

      function renderList() {
        const cVal = elCountry.value.toLowerCase();
        const iVal = elIndustry.value.toLowerCase();
        const pVal = elPcat.value.toLowerCase();
        const qVal = elSearch.value.trim().toLowerCase();

        filtered = allData.filter(item => {
          if (cVal && (item.country || '').toLowerCase() !== cVal) return false;
          if (iVal && (item.industry || '').toLowerCase() !== iVal) return false;
          if (pVal && (item.product_category || '').toLowerCase() !== pVal) return false;
          if (qVal) {
            const hay = ((item.company_name || '') + ' ' + (item.summary || '') + ' ' + (item.product_category || '') + ' ' + (item.industry || '')).toLowerCase();
            if (!hay.includes(qVal)) return false;
          }
          return true;
        });

        elCount.textContent = filtered.length + (filtered.length === 1 ? ' company' : ' companies');

        if (filtered.length === 0) {
          elListBody.innerHTML = '<div class="bd-row"><div style="grid-column: 1 / -1; color:#526D82; padding:12px 0;">No matching companies found.</div></div>';
          return;
        }

        elListBody.innerHTML = filtered.map((item, idx) => {
          const isStar = starredIds.has(item.id);
          return '<div class="bd-row bd-row-item" data-idx="' + idx + '">' +
            '<div class="bd-chk-cell" data-id="' + item.id + '" title="Select company">' + (isStar ? ICON_CHECKED : ICON_UNCHECKED) + '</div>' +
            '<div><span class="bd-pill">' + (item.country || 'korea') + '</span></div>' +
            '<div><span class="bd-pill">' + (item.industry || '') + '</span></div>' +
            '<div class="bd-col-pcat"><span class="bd-pill">' + (item.product_category || '') + '</span></div>' +
            '<div class="bd-cname">' + (item.company_name || '') + '</div>' +
          '</div>';
        }).join('');

        elListBody.querySelectorAll('.bd-chk-cell').forEach(chkEl => {
          chkEl.addEventListener('click', e => {
            e.stopPropagation();
            const cid = chkEl.getAttribute('data-id');
            if (starredIds.has(cid)) starredIds.delete(cid); else starredIds.add(cid);
            saveStars();
            renderList();
          });
        });

        elListBody.querySelectorAll('.bd-row-item').forEach(rowEl => {
          rowEl.addEventListener('click', () => {
            openModalAt(parseInt(rowEl.getAttribute('data-idx'), 10));
          });
        });
      }

      const backdrop = document.getElementById('bd-modal-backdrop');
      const mTags = document.getElementById('bd-m-tags');
      const mTitle = document.getElementById('bd-m-title');
      const mStarBtn = document.getElementById('bd-m-star-btn');
      const mImg = document.getElementById('bd-m-img');
      const mSummary = document.getElementById('bd-m-summary');
      const mUrl = document.getElementById('bd-m-url');
      const mScroll = document.getElementById('bd-modal-scroll');

      function syncModalStarBtn(item) {
        const isStar = starredIds.has(item.id);
        mStarBtn.className = 'bd-modal-star-btn' + (isStar ? ' starred' : '');
        mStarBtn.innerHTML = (isStar ? ICON_CHECKED : ICON_UNCHECKED) + '<span>select</span>';
      }

      function openModalAt(idx) {
        if (!filtered.length) return;
        if (idx < 0) idx = filtered.length - 1;
        if (idx >= filtered.length) idx = 0;
        currentModalIdx = idx;
        const item = filtered[idx];

        mTags.innerHTML = [item.country, item.industry, item.product_category]
          .filter(Boolean)
          .map(t => '<span class="bd-modal-tag">' + t + '</span>')
          .join('');
        mTitle.textContent = item.company_name || '';
        syncModalStarBtn(item);

        const rawSum = (item.summary || '').split(/\r?\n|•/).map(s => s.trim()).filter(Boolean);
        mSummary.innerHTML = rawSum.map(line => '<li>' + line + '</li>').join('');

        const tUrl = item.target_url || 'https://biz-galaxy.sistarcompany.com';
        mUrl.href = tUrl;
        mUrl.textContent = tUrl.replace(/^https?:\/\//, '') + ' \u2192';

        const dId = item.drive_img_id || item.drive_logo_id || '';
        const realFallback = getCategoryFallbackPhoto(item);
        let primaryImg = item.image_url || '';
        if (!primaryImg || primaryImg.endsWith('.svg')) {
          primaryImg = dId ? ('https://drive.google.com/thumbnail?id=' + dId + '&sz=w700') : realFallback;
        }

        mImg.onerror = function() {
          if (mImg.src !== realFallback) {
            mImg.src = realFallback;
          }
        };
        mImg.src = primaryImg;

        mScroll.scrollTop = 0;
        backdrop.classList.add('open');
      }

      mUrl.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        window.open(mUrl.href, '_blank', 'noopener,noreferrer');
      });

      mStarBtn.addEventListener('click', () => {
        if (currentModalIdx < 0 || !filtered[currentModalIdx]) return;
        const item = filtered[currentModalIdx];
        if (starredIds.has(item.id)) starredIds.delete(item.id); else starredIds.add(item.id);
        saveStars();
        syncModalStarBtn(item);
        renderList();
      });

      document.getElementById('bd-prev-btn').addEventListener('click', e => {
        e.stopPropagation();
        openModalAt(currentModalIdx - 1);
      });
      document.getElementById('bd-next-btn').addEventListener('click', e => {
        e.stopPropagation();
        openModalAt(currentModalIdx + 1);
      });

      document.addEventListener('keydown', e => {
        if (!backdrop.classList.contains('open')) return;
        if (e.key === 'ArrowLeft') openModalAt(currentModalIdx - 1);
        else if (e.key === 'ArrowRight') openModalAt(currentModalIdx + 1);
        else if (e.key === 'Escape') backdrop.classList.remove('open');
      });

      document.getElementById('bd-m-close').addEventListener('click', () => backdrop.classList.remove('open'));
      backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.classList.remove('open'); });

      const inqBackdrop = document.getElementById('bd-inq-backdrop');
      const inqChips = document.getElementById('bd-inq-chips');

      function renderInqChips() {
        const selected = allData.filter(d => starredIds.has(d.id));
        if (selected.length === 0) {
          inqChips.innerHTML = '<span style="font-size:0.78rem; color:#526D82;">No selected companies yet. Click select on any company to add.</span>';
          return;
        }
        inqChips.innerHTML = selected.map(d =>
          '<span class="bd-inq-chip">' + ICON_CHECKED + '<span>' + d.company_name + '</span><button type="button" data-rm="' + d.id + '">&times;</button></span>'
        ).join('');
        inqChips.querySelectorAll('button[data-rm]').forEach(btn => {
          btn.addEventListener('click', () => {
            starredIds.delete(btn.getAttribute('data-rm'));
            saveStars();
            renderList();
            renderInqChips();
          });
        });
      }

      function openInquiryModal(autoStarCurrent) {
        if (autoStarCurrent && currentModalIdx >= 0 && filtered[currentModalIdx]) {
          starredIds.add(filtered[currentModalIdx].id);
          saveStars();
          syncModalStarBtn(filtered[currentModalIdx]);
          renderList();
        }
        renderInqChips();
        inqBackdrop.classList.add('open');
      }

      document.getElementById('bd-open-star-modal').addEventListener('click', () => openInquiryModal(false));
      document.getElementById('bd-m-inquire-now').addEventListener('click', () => openInquiryModal(true));
      document.getElementById('bd-inq-close').addEventListener('click', () => inqBackdrop.classList.remove('open'));
      inqBackdrop.addEventListener('click', e => { if (e.target === inqBackdrop) inqBackdrop.classList.remove('open'); });

      document.getElementById('bd-inq-submit').addEventListener('click', async () => {
        const selectedNames = allData.filter(d => starredIds.has(d.id)).map(d => d.company_name);
        const sender = document.getElementById('bd-inq-sender').value.trim();
        const msg = document.getElementById('bd-inq-msg').value.trim();
        const btn = document.getElementById('bd-inq-submit');

        if (!sender && !msg) {
          alert('Please enter your email/contact and a brief message.');
          return;
        }

        const payload = {
          to: 'sc@sistarcompany.com',
          sender: sender || 'Anonymous Visitor',
          companies: selectedNames,
          message: msg
        };

        btn.textContent = 'sending...';
        btn.disabled = true;
        try {
          await fetch(GAS_WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          btn.textContent = 'sent to sc@sistarcompany.com !';
          document.getElementById('bd-inq-msg').value = '';
          setTimeout(() => {
            btn.disabled = false;
            btn.textContent = 'send message';
            inqBackdrop.classList.remove('open');
          }, 1400);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'send message';
        }
      });

      elCountry.addEventListener('change', renderList);
      elIndustry.addEventListener('change', () => { updateProductCategories(); renderList(); });
      elPcat.addEventListener('change', renderList);
      elSearch.addEventListener('input', renderList);

      updateProductCategories();
      renderList();
    })();
  </script>
</body>
</html>
